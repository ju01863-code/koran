<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>
  <!-- Quran / Book Graphic -->
  <g filter="url(#shadow)" transform="translate(86, 120)">
    <!-- Left page -->
    <path d="M170 30 C 110 5, 40 20, 10 35 L 10 215 C 40 200, 110 185, 170 210 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Right page -->
    <path d="M170 30 C 230 5, 300 20, 330 35 L 330 215 C 300 200, 230 185, 170 210 Z" fill="#ecfdf5" opacity="0.95"/>
    <!-- Center spine -->
    <line x1="170" y1="30" x2="170" y2="210" stroke="#065f46" stroke-width="4"/>
    <!-- Quran Arabic text lines -->
    <line x1="35" y1="75" x2="145" y2="65" stroke="#065f46" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="35" y1="115" x2="145" y2="105" stroke="#065f46" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="35" y1="155" x2="125" y2="145" stroke="#065f46" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="195" y1="65" x2="305" y2="75" stroke="#065f46" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="195" y1="105" x2="305" y2="115" stroke="#065f46" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <line x1="215" y1="145" x2="305" y2="155" stroke="#065f46" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Golden Crescent & Star atop -->
  <g transform="translate(256, 90)">
    <path d="M-2 -35 A 28 28 0 1 0 25 15 A 22 22 0 1 1 -2 -35 Z" fill="url(#gold)"/>
    <circle cx="22" cy="-16" r="5" fill="url(#gold)"/>
  </g>
  <!-- Bengali Subtext -->
  <text x="256" y="415" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-weight="bold" font-size="42" letter-spacing="2">আরবি সহজ</text>
</svg>